# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Install the CodeRabbit GitHub app for this repository to activate reviews.
# Reviews run on PR creation/updates, independently of GitHub Actions.
language: en-US
tone_instructions: >-
  Be a patient but rigorous C++ mentor. Explain why a choice matters, ask focused
  questions, and help the author reason about alternatives. Prioritize learning
  and actionable feedback over scores or praise.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    base_branches: [".*"]
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  path_instructions:
    - path: "**/*.{h,hpp,hh,cc,cpp,cxx}"
      instructions: |
        This is a C++23 Windows Winsock learning project. Provide review guidance;
        the author wants to implement improvements personally. Do not expand the
        project, generate tests/documentation, or push fixes. Prefer explanations
        and questions over complete replacement implementations.

        Use https://google.github.io/styleguide/cppguide and Google's review
        guidance at https://google.github.io/eng-practices/review/reviewer/looking-for.html.
        Address readability, naming, self-contained headers, interfaces, const
        correctness, explicit conversions, ownership, RAII, and unnecessary
        complexity. When C++23 or the existing exception policy differs from the
        Google guide, explain the discrepancy and tradeoff rather than demanding
        a blanket rewrite. Separate convention preferences from correctness bugs.

        Prioritize undefined behavior and resource safety: bounds and length
        validation, dangling references/views, uninitialized reads, signed
        overflow, unsafe shifts/casts, invalidation, races, leaks, double release,
        and cleanup during exceptions. For Winsock, examine accepted-socket
        ownership, WSAStartup/WSACleanup balance, partial I/O, stream framing,
        disconnects, and ignored error returns. Do not assume a TCP write is a
        complete message at the receiver.

        Explain meaningful performance opportunities such as avoidable copies,
        allocations, poor container choices, blocking, and excessive hot-path
        logging. State the relevant workload/complexity and tradeoffs. Distinguish
        evident unnecessary work from hypotheses needing measurements. Prefer
        simple, readable solutions; do not invent a latency requirement.

        For each substantive finding, identify the code, describe the failure
        scenario or cost, explain why it matters, and ask a focused question about
        the author's reasoning. Discuss the simplest useful alternative and its
        tradeoffs. If useful, suggest a small experiment or boundary case the
        author can try, without requiring a new test framework or CI job. State
        uncertainty and platform/tool limitations; never imply that a review
        proves the absence of UB, memory leaks, or performance problems.
  tools:
    clang:
      enabled: true
    cppcheck:
      enabled: true

chat:
  auto_reply: true

issue_enrichment:
  auto_enrich:
    enabled: false
